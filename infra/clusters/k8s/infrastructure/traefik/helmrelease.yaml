apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      # Pinned exactly (41.6.1 was the resolved version of the previous
      # `>=30.0.0` range). Keep this in lockstep with intentional upgrades.
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    service:
      type: LoadBalancer