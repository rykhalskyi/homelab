# TLS terminates at Cloudflare and Traefik's entrypoint is plain HTTP. Django
# trusts X-Forwarded-Proto (DJANGO_TRUST_PROXY_HEADERS=true); this forces it to
# https so SECURE_SSL_REDIRECT and secure cookies behave (same trick as the
# Euro-Office middleware).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pullini-forwarded-proto
  namespace: homelab
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
