# Public: covered by the wildcard *.otakeessen.com Cloudflare tunnel to Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pullini
  namespace: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-pullini-forwarded-proto@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pullini
                port:
                  number: 80
