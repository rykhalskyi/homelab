# Standalone PostgreSQL for Nextcloud (and future apps), decoupled from the
# Nextcloud Helm chart's bundled `postgresql` subchart.
#
# Pinned to the same major (17) as the subchart it replaces, so the migration
# is a plain logical dump/restore. Credentials come from the existing
# `nextcloud-db` Secret (username / password / postgres-password), so
# Nextcloud's DB settings change only in `dbhost`.
#
# Bitnami moved the community images to `bitnamilegacy`; the chart verifies
# image provenance, so `global.security.allowInsecureImages` opts out of that
# check for the postgres and os-shell images below.
#
# See docs/wiki/pages/postgresql-pgadmin.md for the migration runbook.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: homelab
spec:
  interval: 1h
  # Bitnami's chart is OCI-only now; consume it through the OCIRepository set up
  # in infra/clusters/k8s/infrastructure/sources/postgresql-chart.yaml.
  chartRef:
    kind: OCIRepository
    name: bitnami-postgresql
    namespace: flux-system
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r4
    architecture: standalone
    auth:
      username: nextcloud
      database: nextcloud
      existingSecret: nextcloud-db
    # local-path volumes are root-owned; chown them before postgres (uid 1001) runs.
    volumePermissions:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
