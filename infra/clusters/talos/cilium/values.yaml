# Cilium Helm values for the Talos cluster.
#
# These are the Talos-specific requirements, not personal taste — see
# https://www.talos.dev/latest/kubernetes-guides/network/deploying-cilium/
# The chart is rendered by render.sh and embedded in each control-plane machine
# config as a Talos KubeInlineManifestConfig (create-only).
ipam:
  mode: kubernetes
# kube-proxy-free: Talos runs no kube-proxy, Cilium's eBPF handles Services.
# k8sServiceHost kubePrism to reach the API before service routing exists.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    # Default set minus SYS_MODULE: Talos forbids loading kernel modules.
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
# Talos already mounts cgroup2 and bpffs; Cilium must not try to mount them.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
hubble:
  enabled: true
  relay:
    enabled: true
    # Relay metrics + ServiceMonitor (scraped by kube-prometheus-stack).
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
  ui:
    enabled: true
  # Flow-aware L7/L4 metrics exposed by the agent, e.g. drops, TCP flags,
  # HTTP request rate/latency, DNS. Empty/null would disable metrics entirely.
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
# --- Prometheus integration (kube-prometheus-stack) ---
# Each ServiceMonitor carries the `release: kube-prometheus-stack` label so the
# Prometheus CR's serviceMonitorSelector (which matches the Helm release name)
# picks it up. Requires the ServiceMonitor CRD to exist first, so kube-prometheus-stack
# must be installed before `cilium/install.sh` is (re)run with these values.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
# Single-node cluster: the default 2 operator replicas cannot both schedule
# (they request the same host ports). One replica is plenty; raise this again
# once the cluster has multiple nodes.
operator:
  replicas: 1
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
