# Cluster add-ons for the talos cluster (storage, ingress, monitoring),
# reconciled by Flux from ./infra/clusters/talos/infrastructure.
#
# Mirrors the k8s cluster's infrastructure.yaml. `wait: true` makes Flux wait
# for every resource here to become Ready before it reports success, so the
# `apps` Kustomization (once it exists) can dependOn this.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/clusters/talos/infrastructure
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
