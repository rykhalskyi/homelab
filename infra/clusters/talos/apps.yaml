# Workloads for the talos cluster, reconciled by Flux from ./apps.
#
# Mirrors the k8s cluster's apps.yaml: it `dependsOn` the `infrastructure`
# Kustomization (so CRDs/add-ons are ready) and is applied after it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/clusters/talos/apps
  prune: true
  wait: true
  # The Omarchy VM is intentionally Halted and its ISO waits for a manual
  # `virtctl image-upload`. Flux's generic CRD health check would wait forever:
  # a halted VM keeps Ready=False ("VMI does not exist"), and the ISO
  # DataVolume stays UploadReady until someone uploads it. Treat those expected
  # states as healthy; only hard KubeVirt/CDI errors fail the check.
  # CEL expressions are evaluated against the resource object itself, so fields
  # are top-level: `status.phase`, not `self.status.phase`. Referencing a path
  # that does not exist makes CEL error out, which Flux treats as Unknown and
  # waits on until the timeout.
  healthCheckExprs:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      current: "status.phase == 'Succeeded' || status.phase == 'UploadReady'"
      failed: "status.phase == 'Failed'"
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      current: "status.printableStatus in ['Stopped', 'Provisioning', 'Starting', 'Running', 'Paused', 'Migrating']"
      failed: "status.printableStatus in ['ErrorUnschedulable', 'ErrorPvcNotFound', 'DataVolumeError', 'CrashLoopBackOff']"
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
