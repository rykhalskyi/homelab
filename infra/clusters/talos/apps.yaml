# Workloads for the talos cluster, reconciled by Flux from ./apps.
#
# Mirrors the k8s cluster's apps.yaml: it `dependsOn` the `infrastructure`
# Kustomization (so CRDs/add-ons are ready) and is applied after it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/clusters/talos/apps
  prune: true
  wait: true
  # The Omarchy VM is intentionally Halted and its ISO waits for a manual
  # `virtctl image-upload`. Flux's generic CRD health check would wait forever:
  # a halted VM keeps Ready=False ("VMI does not exist"), and the ISO
  # DataVolume stays UploadReady until someone uploads it. Treat those expected
  # states as healthy; only hard KubeVirt/CDI errors fail the check.
  # `has()` guards are required: Flux evaluates these against freshly applied
  # objects before their status is populated, and an unguarded field access
  # makes CEL error out ("no such attribute"), which Flux treats as Unknown and
  # then waits for the full timeout.
  healthCheckExprs:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      current: "has(self.status.phase) && (self.status.phase == 'Succeeded' || self.status.phase == 'UploadReady')"
      failed: "has(self.status.phase) && self.status.phase == 'Failed'"
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      current: "has(self.status.printableStatus) && self.status.printableStatus in ['Stopped', 'Provisioning', 'Starting', 'Running', 'Paused', 'Migrating']"
      failed: "has(self.status.printableStatus) && self.status.printableStatus in ['ErrorUnschedulable', 'ErrorPvcNotFound', 'DataVolumeError', 'CrashLoopBackOff']"
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
