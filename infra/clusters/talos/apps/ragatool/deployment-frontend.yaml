# Ragatool Angular UI served by nginx. Also proxies /api/ to the backend so the
# browser uses a single origin (no CORS, one LAN hostname).
#
# Both API_URL and BACKEND_URL come from ragatool-frontend-config at runtime.
# Bootstrap note: the digest below is the pre-runtime-config `latest` image;
# rebuild the images once (the pin PR then replaces both references).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragatool-frontend
  namespace: ragatool
  labels:
    app: ragatool-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragatool-frontend
  template:
    metadata:
      labels:
        app: ragatool-frontend
    spec:
      # The stock nginx image starts as root (master) and drops to nginx for the
      # workers; its entrypoint also rewrites /config.js and renders the server
      # template, which needs write access to /usr/share/nginx/html and
      # /etc/nginx/conf.d. Use the nginx-unprivileged image before tightening
      # this to a non-root user.
      containers:
        - name: frontend
          image: ghcr.io/rykhalskyi/ragatool-frontend:sha-b0ce20fd1a4b4a75a6c7928e588894fed23c6dc0@sha256:0aea028c86e167b9ac445942735be98e0c26ac66b03bbc143a5ff00e74034f8f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: ragatool-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
