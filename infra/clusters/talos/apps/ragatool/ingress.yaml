# LAN-only HTTPS via the Let's Encrypt wildcard (*.lan.otakeessen.com).
#
# `/mcp` is the streamable-HTTP MCP endpoint (backend :8002), so MCP clients use
# the same hostname without another DNS record. Traefik picks the longest
# matching path. SSE still needs its own host (see ingress-mcp-sse.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragatool
  namespace: ragatool
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ragatool.lan.otakeessen.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: ragatool-backend
                port:
                  number: 8002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragatool-frontend
                port:
                  number: 80
