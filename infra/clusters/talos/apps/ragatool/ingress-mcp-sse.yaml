# LAN-only MCP-over-SSE endpoint (backend :8001), HTTPS via the wildcard cert.
#
#   MCP URL: https://ragatool-mcp.lan.otakeessen.com/mcp
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragatool-mcp-sse
  namespace: ragatool
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ragatool-mcp.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragatool-backend
                port:
                  number: 8001
