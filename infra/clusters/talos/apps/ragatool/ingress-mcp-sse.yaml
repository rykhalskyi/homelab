# LAN-only MCP-over-SSE endpoint. The backend's FastMCP SSE server listens on
# 8001 and serves /mcp. Separate host from the UI so the path does not collide
# with the streamable-HTTP MCP server on 8002.
#
#   client /etc/hosts: 192.168.2.240 ragatool-mcp.homelab.home.arpa
#   MCP URL:           http://ragatool-mcp.homelab.home.arpa/mcp
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragatool-mcp-sse
  namespace: ragatool
spec:
  ingressClassName: traefik
  rules:
    - host: ragatool-mcp.homelab.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragatool-backend
                port:
                  number: 8001
