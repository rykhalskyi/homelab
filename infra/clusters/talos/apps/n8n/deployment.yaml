# n8n, served LAN-only at https://n8n.lan.otakeessen.com.
#
# Postgres is the dedicated CloudNativePG `n8n` Cluster (n8n-rw service); the
# initContainer waits for it before the entrypoint runs migrations. The image is
# pinned by tag + digest; bump both on upgrade.
#
# Secrets (out of band, SOPS): `n8n-db` (username/password) and `n8n-secrets`
# (N8N_ENCRYPTION_KEY). Never change N8N_ENCRYPTION_KEY after credentials have
# been saved, or n8n can no longer decrypt them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - "until nc -z n8n-rw.n8n.svc.cluster.local 5432; do echo waiting for n8n-rw; sleep 2; done"
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.47.4@sha256:56a3f0d56c2888b53ca7d89de4aa3de702888f33667c96a1f1d7118548f979e9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: N8N_HOST
              value: n8n.lan.otakeessen.com
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://n8n.lan.otakeessen.com/
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.lan.otakeessen.com
            - name: N8N_SECURE_COOKIE
              value: "true"
            # Traefik is the only proxy on the LAN path (Cloudflare never sees
            # this host), so n8n trusts one X-Forwarded-* hop.
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: GENERIC_TIMEZONE
              value: Europe/Berlin
            - name: TZ
              value: Europe/Berlin
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-rw.n8n.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-db
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db
                  key: password
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          # First boot runs the database migrations; do not let liveness kill
          # the Pod while that is still in progress.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
