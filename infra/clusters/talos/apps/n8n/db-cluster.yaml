# Dedicated PostgreSQL for n8n, managed by CloudNativePG (same pattern as the
# pullini/forgejo Clusters).
#
# Clean install: the cluster creates the `n8n` database owned by `n8n`;
# credentials come from the out-of-band `n8n-db` Secret (keys `username` /
# `password`). The Deployment reuses the same keys for DB_POSTGRESDB_USER and
# DB_POSTGRESDB_PASSWORD, so there is one source of truth for the password.
#
# - `n8n` namespace; PVC on the local-path StorageClass.
# - Operand image pinned by digest (repo convention).
# - Backups are intentionally omitted here. To add them, copy the
#   `barmanObjectStore` block from apps/pullini/db-cluster.yaml and create a
#   namespaced `cnpg-minio` Secret in `n8n` (s3://cnpg-backups/n8n).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n
  namespace: n8n
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db
