# LAN-only HTTPS via the Let's Encrypt wildcard (*.lan.otakeessen.com).
# Pi-hole resolves the name to Traefik's LoadBalancer VIP (192.168.2.240);
# the Cloudflare tunnel 404s the whole `lan` sub-zone, so it never goes public.
# Distinct from the k8s cluster's LAN pgAdmin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: databases
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: pgadmin.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
