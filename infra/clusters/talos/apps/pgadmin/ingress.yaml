# LAN-only on purpose: the host is `*.home.arpa`, NOT under
# `*.otakeessen.com`, so Traefik serves it on its LoadBalancer VIP and it is
# never exposed beyond the LAN. The host is distinct from the k8s cluster's
# pgAdmin (`pgadmin.homelab.local`, node-one) so the two never collide.
#
# Reach it by adding this to your client /etc/hosts:
#
#   192.168.2.240 pgadmin-db.homelab.home.arpa
#
# then open http://pgadmin-db.homelab.home.arpa/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: databases
spec:
  ingressClassName: traefik
  rules:
    - host: pgadmin-db.homelab.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
