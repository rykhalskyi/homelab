# TLS terminates at Cloudflare and Traefik's entrypoint is plain HTTP, so the
# public ingress forces X-Forwarded-Proto: https — same fix as the Nextcloud /
# Forgejo / Euro-Office ingresses, keeping subsonic/cover URLs https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-forwarded-proto
  namespace: navidrome
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
