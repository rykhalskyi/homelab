# Windows 11 guest disk. Blank: the Windows installer creates the partition
# table and filesystem. 100 GiB comfortably covers the OS, updates and apps.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: win11-disk
  namespace: vms
spec:
  source:
    blank: {}
  pvc:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 100Gi
---
# Windows 11 installation media. `source.upload` leaves the volume waiting for
# `virtctl image-upload`, so the ISO is never downloaded by the cluster and is
# never committed to Git. Upload it once with:
#
#   virtctl image-upload dv win11-iso -n vms --size=10Gi \
#     --image-path=/path/to/Win11.iso --no-create --insecure
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: win11-iso
  namespace: vms
spec:
  source:
    upload: {}
  contentType: iso
  pvc:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 10Gi
---
# virtio-win drivers (viostor/vioscsi storage + NetKVM). Windows Setup cannot
# see a virtio disk or NIC until these are loaded.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: virtio-win-iso
  namespace: vms
spec:
  source:
    http:
      url: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
  contentType: iso
  pvc:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 2Gi
