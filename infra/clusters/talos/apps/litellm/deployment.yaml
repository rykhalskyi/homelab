# LiteLLM proxy. One stateless replica is enough for this LAN.
#
# LiteLLM v1.106+ refuses to start without a master key. We use a fixed,
# non-secret dummy that matches Open WebUI's OPENAI_API_KEY: the proxy is
# intentionally unauthenticated inside the LAN, so this is not a security
# boundary (do not reuse it anywhere else).
#
# The Langfuse keys are optional: without the `litellm-langfuse` Secret the
# proxy still serves requests, but no traces are exported. After creating and
# applying the Secret, restart the Deployment to pick it up:
#
#   kubectl -n litellm rollout restart deploy/litellm
#
# The image is pinned by tag + digest; bump both on upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              value: sk-litellm
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-langfuse
                  key: langfuse-public-key
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-langfuse
                  key: langfuse-secret-key
                  optional: true
            - name: LANGFUSE_HOST
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config
