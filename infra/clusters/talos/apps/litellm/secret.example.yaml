# Shape of the Langfuse keys; the real Secret is local-only (never commit it).
#
# Create an SOPS-encrypted Secret in infra/clusters/talos/apps/secrets/:
#
#   cat > infra/clusters/talos/apps/secrets/litellm-langfuse.sops.yaml <<'EOF'
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: litellm-langfuse
#     namespace: litellm
#   type: Opaque
#   stringData:
#     langfuse-public-key: "pk-lf-..."
#     langfuse-secret-key: "sk-lf-..."
#   EOF
#   sops --encrypt --in-place infra/clusters/talos/apps/secrets/litellm-langfuse.sops.yaml
#   bash infra/clusters/talos/apps/secrets/apply.sh
#
# Generate the key pair in the Langfuse project UI
# (https://langfuse.lan.otakeessen.com -> project -> Settings -> API keys).
apiVersion: v1
kind: Secret
metadata:
  name: litellm-langfuse
  namespace: litellm
type: Opaque
stringData:
  langfuse-public-key: "pk-lf-replace-me"
  langfuse-secret-key: "sk-lf-replace-me"
