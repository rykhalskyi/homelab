# LAN-only HTTPS for the same OpenAI-compatible API, via the wildcard cert.
# Remove this file if the traced API should stay in-cluster only.
#
# LiteLLM uses a fixed, non-secret master key (sk-litellm) because v1.106+
# refuses to start without one. It is a LAN-only dummy, not a security
# boundary. Keep the host LAN-only and never add it to
# apps/cloudflared/configmap.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: llm.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
