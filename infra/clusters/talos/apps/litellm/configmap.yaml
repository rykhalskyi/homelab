# Model aliases presented to clients, all backed by the LAN Ollama Service.
#
# `drop_params: true` lets OpenAI clients send parameters Ollama does not
# support without failing the request. `langfuse_otel` exports spans to
# Langfuse's OTLP endpoint; it does not depend on the Langfuse SDK and stays
# quiet when the keys are absent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: llama3.2:3b
        litellm_params:
          model: ollama/llama3.2:3b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen2.5-coder:3b
        litellm_params:
          model: ollama/qwen2.5-coder:3b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: gemma3:1b
        litellm_params:
          model: ollama/gemma3:1b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen3.5:4b
        litellm_params:
          model: ollama/qwen3.5:4b
          api_base: http://ollama.ollama.svc.cluster.local:11434

    litellm_settings:
      drop_params: true
      success_callback: ["langfuse_otel"]
      failure_callback: ["langfuse_otel"]
