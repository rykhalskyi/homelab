# Dedicated PostgreSQL for Transcributed, managed by CloudNativePG.
#
# Clean install: the cluster is created with the `transcributed` database owned
# by `transcributed`. Credentials come from the out-of-band
# `transcributed-secrets` Secret (keys `username` / `password`), which also
# carries the `DATABASE_URL` / `RABBITMQ_URL` keys consumed by the chart. The
# CNPG bootstrap password and the password inside `DATABASE_URL` must match.
#
# Backups: continuous WAL archiving + a daily base backup (ScheduledBackup
# `transcributed-daily`) to the LAN MinIO under `s3://cnpg-backups/transcributed`.
# The `cnpg-rw` MinIO policy must include that prefix. Because Secrets are
# namespaced, the S3 credentials live in the out-of-band `cnpg-minio` Secret in
# *this* namespace.
#
# The operand image is pinned by digest (repo convention).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: transcributed
  namespace: transcributed
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: transcributed
      owner: transcributed
      secret:
        name: transcributed-secrets
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/transcributed
      endpointURL: http://192.168.2.112:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
