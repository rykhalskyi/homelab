# Transcributed web UI, control plane, and Faster-Whisper worker.
#
# The chart is published as an OCI artifact by the app repo. Chart 0.2.5 adds
# the UI Deployment/Service/Ingress. Its images are tagged `v<version>` and
# `sha-<commit>`, while the chart defaults to `<version>`, so all three tags are
# pinned explicitly (the pin workflow maintains them) to avoid ImagePullBackOff.
#
# The UI is the only LAN ingress. It serves the SPA and proxies /api, /healthz
# and /readyz to the API Service, so it uses a single origin and the API
# Ingress stays disabled on the same host. The UI Ingress uses the LAN wildcard
# certificate (HTTPS) on Traefik's LoadBalancer VIP 192.168.2.240.
# The app has no authentication yet, so it must not be routed through the
# public Cloudflare tunnel.
#
# Chart 0.2.5 also removed the invalid `ScaledJob.cooldownPeriod` field, so the
# old postRenderer workaround is gone.
#
# The NAS share is mounted read-only at /nas/lectures for both the API and the
# workers. `/volume1/video/lectures` must be exported to the node IPs before
# this release can become Ready. Mount options are left at the client default:
# the chart's nfsvers=4.1 default is rejected by the Synology (`Protocol not
# supported`), while the inline NFS mounts used by Navidrome/Nextcloud work.
#
# Worker concurrency: KEDA creates one Job per queued message (queueLength 1),
# up to three at a time (maxReplicaCount 3); preferred anti-affinity spreads
# Jobs across the three nodes (one per node).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcributed
  namespace: transcributed
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: transcributed
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ui:
      image:
        tag: sha-193d40e29863451615fe96397689aba0521c3bc0@sha256:7ef3681ea97f4bb24fbdd4c2373e01c78d294f6f99479c0593cc23ad9fc53ed3
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: transcributed.lan.otakeessen.com
            paths:
              - path: /
                pathType: Prefix
    api:
      image:
        tag: sha-193d40e29863451615fe96397689aba0521c3bc0@sha256:a95fe1b866ce49e51b79d549a2faf1afd37026f256fcd81c1cf2e4e8f9523c64
      # The UI proxies API traffic on the same host; enabling this too would
      # create two Ingress routers for transcributed.lan.otakeessen.com.
      ingress:
        enabled: false
    worker:
      image:
        tag: sha-193d40e29863451615fe96397689aba0521c3bc0@sha256:65f60cb697cf8588417ca66c22c066876f8deb66ffeb19fd95b673e0ef5e4133
      keda:
        maxReplicaCount: 3
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 12Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
    migrations:
      backoffLimit: 6
      activeDeadlineSeconds: 900
    nas:
      enabled: true
      create: true
      server: 192.168.2.112
      share: /volume1/video/lectures
      mountPath: /nas/lectures
      capacity: 10Ti
      accessMode: ReadOnlyMany
      mountOptions: []
