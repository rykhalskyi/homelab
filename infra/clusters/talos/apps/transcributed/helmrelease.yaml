# Transcributed web UI, control plane, and Faster-Whisper worker.
#
# The chart is published as an OCI artifact by the app repo. Chart 0.3.0 adds
# the frame extraction workflow; 0.2.5 added the UI Deployment/Service/Ingress.
# Its images are tagged `v<version>` and `sha-<commit>`, while the chart defaults
# to `<version>`, so all four image tags are pinned explicitly (the pin workflow
# maintains them) to avoid ImagePullBackOff.
#
# The UI is the only LAN ingress. It serves the SPA and proxies /api, /healthz
# and /readyz to the API Service, so it uses a single origin and the API
# Ingress stays disabled on the same host. The UI Ingress uses the LAN wildcard
# certificate (HTTPS) on Traefik's LoadBalancer VIP 192.168.2.240.
# The app has no authentication yet, so it must not be routed through the
# public Cloudflare tunnel.
#
# Chart 0.2.5 also removed the invalid `ScaledJob.cooldownPeriod` field, so the
# old postRenderer workaround is gone.
#
# The NAS share is mounted read-only at /nas/lectures for both the API and the
# workers. `/volume1/video/lectures` must be exported to the node IPs before
# this release can become Ready. Mount options are left at the client default:
# the chart's nfsvers=4.1 default is rejected by the Synology (`Protocol not
# supported`), while the inline NFS mounts used by Navidrome/Nextcloud work.
#
# Worker concurrency: KEDA creates one Job per queued message (queueLength 1),
# up to three at a time (maxReplicaCount 3); preferred anti-affinity spreads
# Jobs across the three nodes (one per node).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcributed
  namespace: transcributed
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: transcributed
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ui:
      image:
        tag: sha-feed3f4e602d18f0082e562916759ac79f43312a@sha256:a6feacc53a02394d57e54cf19b33f51c8aff5a32b701f764ae8be8876608945c
      ingress:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: transcributed.lan.otakeessen.com
            paths:
              - path: /
                pathType: Prefix
    api:
      image:
        tag: sha-feed3f4e602d18f0082e562916759ac79f43312a@sha256:bcb76e45602ccbab391240012c646830bb08894151469f59cf365b2257ce13bb
      # The UI proxies API traffic on the same host; enabling this too would
      # create two Ingress routers for transcributed.lan.otakeessen.com.
      ingress:
        enabled: false
    worker:
      image:
        tag: sha-feed3f4e602d18f0082e562916759ac79f43312a@sha256:2728569924df5aa2fcf8befbc39f1556da6a0e1378e8339e67c3840442f024df
      keda:
        maxReplicaCount: 3
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 12Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
    frameWorker:
      image:
        tag: sha-feed3f4e602d18f0082e562916759ac79f43312a@sha256:c12d02ad02686592111b47e907c3881c43c00d26edca0a52b1d888cdcefd3ee0
    migrations:
      backoffLimit: 6
      activeDeadlineSeconds: 900
    nas:
      enabled: true
      create: true
      server: 192.168.2.112
      share: /volume1/video/lectures
      mountPath: /nas/lectures
      capacity: 10Ti
      accessMode: ReadOnlyMany
      mountOptions: []
