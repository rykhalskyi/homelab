# Transcributed web UI, control plane, and Faster-Whisper worker.
#
# The chart is published as an OCI artifact by the app repo. Chart 0.2.5 adds
# the UI Deployment/Service/Ingress. Its images are tagged `v<version>` and
# `sha-<commit>`, while the chart defaults to `<version>`, so all three tags are
# pinned explicitly (the pin workflow maintains them) to avoid ImagePullBackOff.
#
# The UI is the only LAN ingress. It serves the SPA and proxies /api, /healthz
# and /readyz to the API Service, so it uses a single origin and the API
# Ingress stays disabled on the same host. The Ingress is plain HTTP on
# Traefik's LAN LoadBalancer VIP 192.168.2.240 (see infrastructure/traefik).
# The app has no authentication yet, so it must not be routed through the
# public Cloudflare tunnel.
#
# Chart 0.2.5 also removed the invalid `ScaledJob.cooldownPeriod` field, so the
# old postRenderer workaround is gone.
#
# The NAS share is mounted read-only at /nas/lectures for both the API and the
# workers. `/volume1/video/lectures` must be exported to the node IPs before
# this release can become Ready. Mount options are left at the client default:
# the chart's nfsvers=4.1 default is rejected by the Synology (`Protocol not
# supported`), while the inline NFS mounts used by Navidrome/Nextcloud work.
#
# Worker concurrency: KEDA creates one Job per queued message (queueLength 1),
# up to two at a time (maxReplicaCount 2); preferred anti-affinity spreads
# Jobs across the two nodes (one per node).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcributed
  namespace: transcributed
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: transcributed
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ui:
      image:
        tag: sha-2f6b6f5839f49db2f900a175f19f3f9d9044485c@sha256:1e73ded75aac8cca2d5b7cb16bb3eca2b524a7e851b134bb384ab274334bf94c
      ingress:
        enabled: true
        className: traefik
        hosts:
          - host: transcributed.homelab.home.arpa
            paths:
              - path: /
                pathType: Prefix
    api:
      image:
        tag: sha-2f6b6f5839f49db2f900a175f19f3f9d9044485c@sha256:3611e9e4c328f2d06b6918babb86c948dedaf0fa158c446badc198bcd6214839
      # The UI proxies API traffic on the same host; enabling this too would
      # create two Ingress routers for transcributed.homelab.home.arpa.
      ingress:
        enabled: false
    worker:
      image:
        tag: sha-2f6b6f5839f49db2f900a175f19f3f9d9044485c@sha256:c30b3c9a679054cf634112afc04f5814575ce5a6ce3361651f90a47852e6cade
      keda:
        maxReplicaCount: 2
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 12Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
    migrations:
      backoffLimit: 6
      activeDeadlineSeconds: 900
    nas:
      enabled: true
      create: true
      server: 192.168.2.112
      share: /volume1/video/lectures
      mountPath: /nas/lectures
      capacity: 10Ti
      accessMode: ReadOnlyMany
      mountOptions: []
