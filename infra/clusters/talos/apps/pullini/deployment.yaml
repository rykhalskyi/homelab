# Pullini web + scheduler sidecar. The scheduler shares the ReadWriteOnce data
# volume with the web container (a separate CronJob could not mount it) and runs
# `manage.py sync_projects` in a loop; both share the same database.
#
# Mirrors infra/clusters/k8s/apps/pullini/deployment.yaml, namespace `pullini`.
#
# The image is built on demand by the pullini repo's "Build image" workflow and
# pinned here as sha-<commit>@sha256:<digest>;
# .github/workflows/update-pullini-image-pin.yml opens the PR that bumps it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullini
  namespace: pullini
  labels:
    app: pullini
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pullini
  template:
    metadata:
      labels:
        app: pullini
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # The database is a CloudNativePG Cluster, not a HelmRelease, so there is
      # no `dependsOn`. Wait for it before the entrypoint runs `migrate` —
      # otherwise a first boot can race the DB and crash-loop.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until nc -z pullini-rw.pullini.svc.cluster.local 5432; do echo waiting for pullini-rw; sleep 2; done"
      containers:
        - name: web
          image: ghcr.io/rykhalskyi/pullini:sha-b5582bb85f59de7d2bef65e3feccef45ca6f747e@sha256:739e9e8d3105314a473113ad58abe5c16cf101cb73721a2c0824938c71bcfa9d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pullini-config
            - secretRef:
                name: pullini-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # Kubelet probes hit the Pod IP as the Host header, which Django
          # rejects (ALLOWED_HOSTS). Send the real hostname instead.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: wiki.otakeessen.com
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders:
                - name: Host
                  value: wiki.otakeessen.com
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # `args` (not `command`) keeps the image ENTRYPOINT, which with
        # PULLINI_SKIP_BOOTSTRAP=true skips migrations and execs the scheduler.
        - name: scheduler
          image: ghcr.io/rykhalskyi/pullini:sha-b5582bb85f59de7d2bef65e3feccef45ca6f747e@sha256:739e9e8d3105314a473113ad58abe5c16cf101cb73721a2c0824938c71bcfa9d
          imagePullPolicy: IfNotPresent
          args: ["/app/docker/scheduler.sh"]
          env:
            - name: PULLINI_SKIP_BOOTSTRAP
              value: "true"
          envFrom:
            - configMapRef:
                name: pullini-config
            - secretRef:
                name: pullini-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pullini-data
