# Template only -- do not commit real secrets. The real Secret is a local,
# SOPS/age-encrypted file (apps/secrets/pullini-secrets.sops.yaml) applied out
# of band with apps/secrets/apply.sh; see the talos README / wiki.
#
# `username` / `password` are consumed by the CNPG `pullini` Cluster
# (bootstrap.initdb.secret); `password` MUST match the password embedded in
# `DATABASE_URL`.
apiVersion: v1
kind: Secret
metadata:
  name: pullini-secrets
  namespace: pullini
type: Opaque
stringData:
  username: "pullini"
  password: "replace-with-a-strong-random-value"
  DJANGO_SECRET_KEY: "replace-with-a-long-random-value"
  DATABASE_URL: "postgres://pullini:replace-with-a-strong-random-value@pullini-rw.pullini.svc.cluster.local:5432/pullini"
  # Optional: seeds the single admin user on first boot when present.
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "you@example.com"
  DJANGO_SUPERUSER_PASSWORD: "replace-with-a-strong-random-value"
