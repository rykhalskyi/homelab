# Headless Service giving the StatefulSet a stable DNS identity:
# rabbitmq-0.rabbitmq-headless.rabbitmq.svc.cluster.local
#
# RabbitMQ stores its node name in the data directory, so the Pod must keep the
# same hostname (`rabbitmq-0`) across restarts; the StatefulSet handles that.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: rabbitmq
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
