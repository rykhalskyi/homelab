# In-cluster broker endpoint used by the Transcributed API and workers
# (`rabbitmq.rabbitmq.svc.cluster.local:5672`). The management port is exposed
# only inside the cluster for debugging; there is no Ingress.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rabbitmq
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
