# Open WebUI, served LAN-only at https://chat.lan.otakeessen.com.
#
# It reaches Ollama server-side over the in-cluster Service (no CORS and no
# ingress round-trip). The image is pinned by tag + digest; bump both on
# upgrade.
#
# First boot: register the first account (it becomes the admin), then disable
# signups. WEBUI_SECRET_KEY is optional; create the `openwebui-secrets` Secret
# out of band to keep sessions valid across restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: WEBUI_URL
              value: https://chat.lan.otakeessen.com
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: webui-secret-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
