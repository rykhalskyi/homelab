# Open WebUI, served LAN-only at https://chat.lan.otakeessen.com.
#
# It talks to LiteLLM (not Ollama directly) over the in-cluster Service, so
# every chat is traced in Langfuse. The direct Ollama connection is disabled.
# The image is pinned by tag + digest; bump both on upgrade.
#
# First boot: register the first account (it becomes the admin), then disable
# signups. WEBUI_SECRET_KEY is optional; create the `openwebui-secrets` Secret
# out of band to keep sessions valid across restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Open WebUI otherwise keeps the first-run connections in its DB
            # and ignores these env vars. Make the Deployment authoritative so
            # the UI cannot fall back to calling Ollama directly (which would
            # bypass LiteLLM and Langfuse).
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            # LiteLLM has no master key; any bearer token works.
            - name: OPENAI_API_KEY
              value: sk-litellm
            - name: WEBUI_URL
              value: https://chat.lan.otakeessen.com
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secrets
                  key: webui-secret-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # First boot downloads/loads the embedding model; it can take a few
          # minutes on these nodes. Do not let liveness kill it mid-startup.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
