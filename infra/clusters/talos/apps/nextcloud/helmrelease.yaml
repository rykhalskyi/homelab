# Nextcloud on the talos cluster (LAN-only for now).
#
# Mirrors infra/clusters/k8s/apps/nextcloud/helmrelease.yaml, adapted to Talos:
#   - external database is the dedicated CloudNativePG `nextcloud` Cluster
#     (`nextcloud-rw.nextcloud.svc.cluster.local`), not a Bitnami subchart;
#   - storage is the dynamic `local-path` StorageClass (see storage.yaml);
#   - mounts the same Synology NAS share over NFS at /nas (see below);
#   - no `dependsOn: postgresql` (the DB is a CNPG CR, not a HelmRelease), so
#     the Pod retries until `nextcloud-rw` accepts connections — the startup
#     probe below gives `maintenance:install` its full window on first boot.
#
# Clean install: on first boot the official entrypoint runs
# `occ maintenance:install` using the NEXTCLOUD_ADMIN_* env from the
# `nextcloud-admin` Secret. The byebyemoneylist app is baked into the image at
# /opt and copied into custom_apps by the `before-starting` hook.
#
# The image tag is built by .github/workflows/build-nextcloud-image.yml and kept
# in sync by .github/workflows/update-nextcloud-image-pin.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  # First boot does maintenance:install and can exceed the 5m install timeout
  # while the image is still pulling or the DB is warming up; without
  # remediation helm-controller marks the release Stalled/RetriesExceeded and
  # refuses to retry. Let it self-heal (same pattern as the cnpg HelmRelease).
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nextcloud
      version: "9.3.0"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  # The Nextcloud chart hardcodes `subPath` on every persistent mount, and there
  # is no value to turn it off. On containerd 2.x a local-path (hostPath) volume
  # mounted with `subPath` is silently backed by the container overlay instead of
  # the volume, so writes are lost on node reboot (containerd/containerd#13710).
  # Override the rendered mounts to use WHOLE volumes (no subPath): mount the
  # html PVC at /var/www/html (config/, custom_apps/, themes/ then live *inside*
  # it as ordinary subdirectories), the data PVC at /var/www/html/data, and make
  # /var/www/tmp an emptyDir. The CronJob mounts the same volumes.
  #
  # NOTE: if the chart is upgraded, re-check that these volume/mount names and
  # paths still match the rendered Deployment/CronJob.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                template:
                  spec:
                    volumes:
                      - name: nextcloud-tmp
                        emptyDir: {}
                    containers:
                      - name: nextcloud
                        volumeMounts:
                          - $patch: replace
                          - name: nextcloud-main
                            mountPath: /var/www/html
                          - name: nextcloud-data
                            mountPath: /var/www/html/data
                          - name: nextcloud-tmp
                            mountPath: /var/www/tmp
                          - name: nextcloud-hooks
                            mountPath: /docker-entrypoint-hooks.d/before-starting/helm.sh
                            subPath: before-starting.sh
                            readOnly: true
                          - name: nas-nextcloud
                            mountPath: /nas
          - target:
              kind: CronJob
              name: nextcloud-cron
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: nextcloud-cron
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        volumes:
                          - name: nextcloud-tmp
                            emptyDir: {}
                        containers:
                          - name: nextcloud-cron
                            volumeMounts:
                              - $patch: replace
                              - name: nextcloud-main
                                mountPath: /var/www/html
                              - name: nextcloud-data
                                mountPath: /var/www/html/data
                              - name: nextcloud-tmp
                                mountPath: /var/www/tmp
                              - name: nas-nextcloud
                                mountPath: /nas
  values:
    image:
      registry: ghcr.io
      repository: rykhalskyi/homelab-nextcloud
      tag: "sha-ddf60fa863690f4fdf28c04effa8a465cd635eb5@sha256:08434c415b05eb0db3d4deeb6804092f9d250a0349c4c6424c3a7173353a177d"
    replicaCount: 1
    nextcloud:
      # Canonical public hostname (k8s is inactive; talos is now the only
      # cluster). LAN + in-cluster names are also trusted (LAN ingress and the
      # EuroOffice server-to-server calls).
      host: cloud.otakeessen.com
      trustedDomains:
        - cloud.otakeessen.com
        - cloud.lan.otakeessen.com
        - nextcloud.nextcloud.svc.cluster.local
        - nextcloud
      datadir: /var/www/html/data
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      extraEnv:
        # Cilium uses the Kubernetes IPAM (Talos's default pod CIDR is
        # 10.244.0.0/16); this makes the client IP survive the ingress hop.
        - name: TRUSTED_PROXIES
          value: "10.244.0.0/16"
        - name: APACHE_DISABLE_REWRITE_IP
          value: "1"
        - name: FORWARDED_FOR_HEADERS
          value: "HTTP_X_FORWARDED_FOR HTTP_CF_CONNECTING_IP"
        - name: SILICONFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: byebyemoneylist
              key: SILICONFLOW_API_KEY
      hooks:
        before-starting: |
          #!/bin/sh
          set -e
          SRC=/opt/byebyemoneylist
          APP=/var/www/html/custom_apps/byebyemoneylist
          mkdir -p /var/www/html/custom_apps
          if [ -d "$SRC" ]; then
            rm -rf "$APP"
            cp -a "$SRC" "$APP"
          fi
          if [ -n "${SILICONFLOW_API_KEY:-}" ] && [ -d "$APP" ]; then
            printf 'SILICONFLOW_API_KEY=%s\n' "$SILICONFLOW_API_KEY" > "$APP/.env"
            chmod 640 "$APP/.env"
          fi
          # The entrypoint runs `occ maintenance:install` before this hook, but a
          # fresh app volume paired with a pre-existing DB (or an interrupted
          # first boot) can leave Nextcloud without `installed => true`. Never
          # let that crash the container: Apache must still come up so the
          # instance is reachable and the next boot can recover.
          if ! php /var/www/html/occ status 2>/dev/null | grep -q 'installed: true'; then
            echo "byebyemoneylist: Nextcloud not installed yet, skipping app enable"
            exit 0
          fi
          code="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$APP/appinfo/info.xml" 2>/dev/null || true)"
          inst="$(php /var/www/html/occ config:app:get byebyemoneylist installed_version 2>/dev/null || true)"
          if [ "$inst" != "$code" ]; then
            php /var/www/html/occ app:disable byebyemoneylist >/dev/null 2>&1 || true
            php /var/www/html/occ app:enable byebyemoneylist || \
              echo "byebyemoneylist: app:enable failed, will retry on next boot"
          fi
      extraInitContainers:
        # The database is a CloudNativePG Cluster, not a HelmRelease, so there is
        # no `dependsOn`. Wait for it before the entrypoint runs
        # `occ maintenance:install` — otherwise a first boot can race the DB and
        # leave a half-installed instance.
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until nc -z nextcloud-rw.nextcloud.svc.cluster.local 5432; do echo waiting for nextcloud-rw; sleep 2; done"
      # Synology NAS share mounted over NFS and exposed to Nextcloud as a
      # "Local" external storage (same as the k8s cluster). Kubelet on the
      # node running the Pod performs the NFS mount and presents it at /nas.
      # Talos supports NFS via inline pod volumes; the mount points at the LAN
      # NAS (192.168.2.112), reachable from the cluster.
      extraVolumes:
        - name: nas-nextcloud
          nfs:
            server: 192.168.2.112
            path: /volume1/nextcloud
      extraVolumeMounts:
        - name: nas-nextcloud
          mountPath: /nas
    phpClientHttpsFix:
      enabled: true
      protocol: https
    persistence:
      enabled: true
      existingClaim: nextcloud-html
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-rw.nextcloud.svc.cluster.local
      existingSecret:
        enabled: true
        secretName: nextcloud-db
        usernameKey: username
        passwordKey: password
    postgresql:
      enabled: false
    redis:
      enabled: true
      architecture: standalone
      auth:
        existingSecret: nextcloud-redis
        existingSecretPasswordKey: redis-password
      # Nextcloud uses Redis for file locking and distributed cache. The chart
      # default CPU limit (150m) throttles this single-threaded server ~45% of
      # the time under load, which intermittently stalls logins/navigation.
      # Give it headroom (observed usage ~0.07 cores but bursty).
      master:
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 192Mi
    ingress:
      enabled: true
      className: traefik
    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          runAsNonRoot: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # On first boot the entrypoint runs `occ maintenance:install` before Apache
    # listens. The startup probe gates liveness/readiness until Apache answers,
    # so the install gets its full 10m budget.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1
