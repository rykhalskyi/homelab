# Optional BookTailor Langfuse credentials for the talos Nextcloud pod.
#
# Create the real Secret out of band in the `nextcloud` namespace (SOPS or
# kubectl); do NOT commit it:
#
#   kubectl -n nextcloud create secret generic booktailor \
#     --from-literal=langfuse-public-key=pk-lf-... \
#     --from-literal=langfuse-secret-key=sk-lf-...
#
# Generate the key pair in the Langfuse project UI
# (https://langfuse.lan.otakeessen.com). The HelmRelease references both keys
# as optional: without this Secret the pod starts normally and BookTailor runs
# with Langfuse tracing and prompt fetching disabled.
apiVersion: v1
kind: Secret
metadata:
  name: booktailor
  namespace: nextcloud
type: Opaque
stringData:
  langfuse-public-key: "pk-lf-replace-me"
  langfuse-secret-key: "sk-lf-replace-me"
