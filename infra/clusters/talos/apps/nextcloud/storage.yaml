# Storage for the in-cluster Nextcloud on talos.
#
# These use the `nfs` StorageClass (Synology NAS) rather than `local-path`:
# the Nextcloud chart mounts its volumes with `subPath`, and on containerd 2.x a
# hostPath (local-path) volume mounted with `subPath` is silently backed by the
# container overlay, so writes are lost on node reboot
# (containerd/containerd#13710). NFS volumes bind `subPath` correctly.
#
# `nextcloud-data` holds user files (`/var/www/html/data`); resize to taste.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
