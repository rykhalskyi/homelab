# Storage for the in-cluster Nextcloud on talos.
#
# `local-path` (node disk). These are mounted WITHOUT `subPath` — see the
# `postRenderers` mount override in helmrelease.yaml. That matters: on
# containerd 2.x a local-path (hostPath) volume mounted with `subPath` is
# silently backed by the container overlay, so writes are lost on node reboot
# (containerd/containerd#13710). Whole-volume mounts do not have that problem.
#
# `nextcloud-data` holds user files (`/var/www/html/data`); resize to taste.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
