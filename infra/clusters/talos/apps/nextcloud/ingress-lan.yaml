# LAN HTTPS entry for Nextcloud. The HelmRelease Ingress serves the public
# `cloud.otakeessen.com`; this one is the on-LAN `cloud.lan.otakeessen.com`
# (Pi-hole -> 192.168.2.240) using the wildcard certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-lan
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: cloud.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  number: 8080
