# LAN-only on purpose: the host is `*.homelab.home.arpa`, NOT under
# `*.otakeessen.com`, so it is never reachable from outside the LAN. Traefik
# listens on its LoadBalancer VIP (see infrastructure/traefik) and routes by host.
#
# Reach it by adding this to your client /etc/hosts:
#
#   192.168.2.240 homepage.homelab.home.arpa
#
# then open http://homepage.homelab.home.arpa/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.homelab.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
