# LAN-only HTTPS via the Let's Encrypt wildcard (*.lan.otakeessen.com).
# Pi-hole resolves the name to Traefik's LoadBalancer VIP (192.168.2.240);
# the Cloudflare tunnel 404s the whole `lan` sub-zone.
#
# The Ollama API has no built-in authentication. Keep this host LAN-only and
# never add it to apps/cloudflared/configmap.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: ollama
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ollama.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  number: 11434
