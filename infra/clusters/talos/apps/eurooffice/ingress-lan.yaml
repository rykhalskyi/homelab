# LAN-only HTTPS for the Euro-Office DocumentServer, via the wildcard cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eurooffice-lan
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-eurooffice-hide-welcome@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: office-talos.lan.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eurooffice
                port:
                  number: 80
