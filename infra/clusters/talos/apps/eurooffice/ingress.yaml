# Public ingress for the Euro-Office DocumentServer. TLS terminates at
# Cloudflare, so the DS is served over HTTPS to the browser while Traefik speaks
# plain HTTP — hence the `forwarded-proto` middleware (mixed-content fix).
#
# Public on purpose: the browser loads the editor from here, and the
# `*.otakeessen.com` tunnel forwards it to the talos Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eurooffice
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-eurooffice-forwarded-proto@kubernetescrd,nextcloud-eurooffice-hide-welcome@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: office.otakeessen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eurooffice
                port:
                  number: 80
