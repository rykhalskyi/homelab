# The DocumentServer's default landing page (`/` 302s to `/welcome/`) is public
# and not meant for visitors. Redirect only that path to Nextcloud; the editor
# endpoints used for embedding (/web-apps, /coauthoring, /healthcheck, ...) are
# untouched, so editing inside Nextcloud keeps working.
#
# LAN-only for now: Traefik terminates plain HTTP on node-two's :80, so unlike
# the k8s deployment there is no `eurooffice-forwarded-proto` middleware here.
# Phase B (public via Cloudflare) adds that middleware back, because TLS then
# terminates at the Cloudflare edge and the DS would otherwise build asset URLs
# with the wrong scheme.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurooffice-hide-welcome
  namespace: nextcloud
spec:
  redirectRegex:
    regex: '^https?://office-talos\.homelab\.local/welcome/?$'
    replacement: 'http://cloud-talos.homelab.local/'
    permanent: false
