# Single-node ClickHouse for Langfuse.
#
# Langfuse v4 requires ClickHouse >= 25.12; 26.8 is the current LTS and is
# digest-pinned. The chart is pointed at this Service with
# `clickhouse.deploy=false`, so no ClickHouse operator or cert-manager is
# installed. `CLICKHOUSE_CLUSTER_ENABLED=false` in the HelmRelease means the
# schema uses plain MergeTree tables, not ReplicatedMergeTree/Keeper.
#
# Data lives on a local-path PVC. This is a single-instance, LAN-only setup:
# there is no replica or HA; a node loss takes the analytics store down.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
  labels:
    app.kubernetes.io/name: langfuse-clickhouse
    app.kubernetes.io/part-of: langfuse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-clickhouse
        app.kubernetes.io/part-of: langfuse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # users.xml cannot be templated by ClickHouse itself, so render the
        # password from the Secret into an emptyDir before the server starts.
        - name: render-users
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sed "s|__CLICKHOUSE_PASSWORD__|${CLICKHOUSE_PASSWORD}|g" /config/users.xml > /etc/clickhouse-server/users.d/langfuse.xml
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: clickhouse-password
          volumeMounts:
            - name: users
              mountPath: /etc/clickhouse-server/users.d
            - name: users-template
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.28.14@sha256:63e02621435cde1146ab0fde66057091ee75b312d12917c0109a6a0c99bc7ce1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: langfuse
            # The user and grants come from the rendered users.d file; skip
            # the entrypoint's own (SQL-unmodifiable) users_xml user creation.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            - name: CLICKHOUSE_WATCHDOG_ENABLE
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: users
              mountPath: /etc/clickhouse-server/users.d
              readOnly: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: logs
          emptyDir: {}
        - name: users
          emptyDir: {}
        - name: users-template
          configMap:
            name: langfuse-clickhouse-users
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
