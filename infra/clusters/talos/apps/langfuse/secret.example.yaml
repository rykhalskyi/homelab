# Template only -- do not commit real secrets. The real Secrets are local,
# SOPS/age-encrypted files (apps/secrets/langfuse-secrets.sops.yaml and
# langfuse-minio.sops.yaml) applied out of band with apps/secrets/apply.sh.
#
# `username` / `password` are the CNPG bootstrap credentials
# (bootstrap.initdb.secret) and are also read by the HelmRelease through
# `postgresql.auth.existingSecret`.
#
# `default` must equal `redis-password`: Langfuse reads `redis-password` while
# the bundled Valkey sub-chart reads the ACL key named after the user.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: langfuse
type: Opaque
stringData:
  username: "langfuse"
  password: "replace-with-a-strong-random-value"
  salt: "replace-with-openssl-rand-hex-32"
  encryption-key: "replace-with-openssl-rand-hex-32"
  nextauth-secret: "replace-with-a-long-random-value"
  clickhouse-password: "replace-with-a-strong-random-value"
  redis-password: "replace-with-a-strong-random-value"
  default: "replace-with-the-same-value-as-redis-password"
  s3-access-key: "replace-with-the-minio-service-account-access-key"
  s3-secret-key: "replace-with-the-minio-service-account-secret-key"
---
# MinIO credentials for the CNPG physical backups (Secret is namespace-scoped).
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-minio
  namespace: langfuse
type: Opaque
stringData:
  ACCESS_KEY_ID: "replace-with-the-minio-cnpg-service-account-access-key"
  ACCESS_SECRET_KEY: "replace-with-the-minio-cnpg-service-account-secret-key"
