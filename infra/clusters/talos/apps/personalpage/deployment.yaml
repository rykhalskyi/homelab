# Personal landing page served at https://otakeessen.com.
#
# Plain static HTML/CSS (plus a PNG logo) — no build step. The files in `site/`
# are collected into the `personalpage-site` ConfigMap by
# configMapGenerator in kustomization.yaml and mounted read-only at nginx's
# document root. `nginx-unprivileged` runs as uid 101 and listens on 8080.
#
# The image is pinned by tag + digest; bump both on upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalpage
  namespace: personalpage
  labels:
    app: personalpage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personalpage
  template:
    metadata:
      labels:
        app: personalpage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: site
          configMap:
            name: personalpage-site
