# Template only -- do not commit real secrets. The real Secret is a local,
# SOPS/age-encrypted file (apps/secrets/personalpage-ghcr.sops.yaml) applied
# out of band with apps/secrets/apply.sh.
#
# The token is a GitHub PAT with `read:packages`. Create the Secret with:
#
#   kubectl -n personalpage create secret docker-registry ghcr-auth \
#     --docker-server=ghcr.io \
#     --docker-username=rykhalskyi \
#     --docker-password=<github-pat-with-read-packages>
#
# Or use the equivalent SOPS-encrypted Secret in namespace `personalpage`.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: personalpage
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "rykhalskyi",
          "password": "replace-with-a-github-pat-with-read-packages",
          "auth": "replace-with-base64-of-username:password"
        }
      }
    }
