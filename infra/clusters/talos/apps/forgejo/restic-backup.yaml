# Daily restic backup of Forgejo's data volume to the LAN MinIO. CNPG already
# backs up the database; this covers the files -- the bare git repositories and
# Git LFS objects under /data that exist nowhere else.
#
# Mirrors apps/nextcloud/restic-backup.yaml:
# - Repo: s3://restic-backups/forgejo on MinIO (192.168.2.112:9000), written by
#   the least-privilege `restic` user.
# - Credentials: the out-of-band SOPS Secret `forgejo-backup`.
# - Reads `forgejo-data` read-only; runs at 02:00, an hour before the CNPG base
#   backups (03:00). Retention 7 daily / 4 weekly / 6 monthly.
#
# Image pinned by digest; bump tag + digest by hand.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-restic
  namespace: forgejo
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # Root is the simplest way to read the volume; the mount is read-only.
          securityContext:
            runAsUser: 0
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  restic snapshots >/dev/null 2>&1 || restic init
                  # restic exit 3 = some files changed while reading (normal on
                  # a live forge); treat it as success and still prune.
                  set +e
                  restic backup --host forgejo --tag forgejo-data /data
                  rc=$?
                  set -e
                  if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
                    echo "restic backup failed with exit code $rc" >&2
                    exit "$rc"
                  fi
                  restic forget --host forgejo --prune \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:http://192.168.2.112:9000/restic-backups/forgejo
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-backup
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-backup
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-backup
                      key: ACCESS_SECRET_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /tmp/restic-cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: cache
              emptyDir: {}
