# LAN-only ingress: http://git.homelab.local (add a client hosts entry:
# 192.168.2.240 git.homelab.local, Traefik's LoadBalancer VIP). No forced-https middleware -- plain HTTP on
# the LAN, matching the Nextcloud LAN ingress. A public `git.otakeessen.com`
# Ingress (behind the existing *.otakeessen.com tunnel + Cloudflare Access) can
# be added later.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-lan
  namespace: forgejo
spec:
  ingressClassName: traefik
  rules:
    - host: git.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
