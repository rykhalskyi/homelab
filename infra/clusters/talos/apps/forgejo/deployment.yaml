# Forgejo web (self-hosted git forge) on the talos cluster.
#
# Public canonical host: https://git.otakeessen.com (TLS at Cloudflare, the
# *.otakeessen.com tunnel -> Traefik). MUST be put behind Cloudflare Access in
# the dashboard -- the app is otherwise reachable by the internet. A LAN
# ingress (git.homelab.home.arpa, hosts entry 192.168.2.240) works too.
#
# Mirrors infra/phase1/forgejo/docker-compose.yml, adapted to the cluster:
#   - the database is the dedicated CloudNativePG `forgejo` Cluster (not the
#     Compose `db` service);
#   - storage is the `local-path` `forgejo-data` PVC (not a named volume);
#   - config is passed as FORGEJO__<section>__<KEY> env; Forgejo writes app.ini
#     on first start (SECRET_KEY is generated and persisted on /data).
#
# The image runs as root by default (as in Compose) and drops to the `git` user
# (USER_UID/USER_GID = 1000); the Dockerfile exposes /data, 22 and 3000.
# git-over-SSH is NOT exposed (HTTPS only): START_SSH_SERVER=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      # The database is a CloudNativePG Cluster, not a HelmRelease, so there is
      # no `dependsOn`. Wait for it before the entrypoint runs the first-boot
      # migrations -- otherwise a first boot can race the DB and crash-loop.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until nc -z forgejo-rw.forgejo.svc.cluster.local 5432; do echo waiting for forgejo-rw; sleep 2; done"
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16@sha256:e2c34a699543ca8a00217ee9ab2bea5feedc98bd6d0ea95ec287d3b7ae1355c6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            # Canonical public hostname (TLS terminates at Cloudflare). The LAN
            # ingress (git.homelab.home.arpa) still works; links use this URL.
            - name: FORGEJO__server__DOMAIN
              value: git.otakeessen.com
            - name: FORGEJO__server__ROOT_URL
              value: https://git.otakeessen.com/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # git-over-SSH stays off for now (HTTPS-only first cut).
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
            # Skip the web installer: config is complete via env + a ready DB.
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            # Trust forwarded headers from Traefik (Talos/Cilium pod CIDR).
            - name: FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: 10.244.0.0/16
            # No self-registration -- accounts are created by an admin.
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-rw.forgejo.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__SSL_MODE
              value: disable
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-db
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          # First boot runs DB migrations before Forgejo answers; gate the other
          # probes so it gets its full window.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
