# Dedicated PostgreSQL for Forgejo, managed by CloudNativePG (mirrors the
# `pullini` / `nextcloud` Clusters).
#
# Credentials come from the out-of-band `forgejo-db` Secret (keys `username` /
# `password`), which the Deployment also consumes as
# FORGEJO__database__PASSWD -- one source of truth, no operator-generated
# `forgejo-app` Secret.
#
# Backups: continuous WAL archiving + a daily base backup (ScheduledBackup
# `forgejo-daily`) to the LAN MinIO under `s3://cnpg-backups/forgejo`. Because
# Secrets are namespaced, the S3 credentials live in the out-of-band
# `cnpg-minio` Secret in *this* namespace, and the MinIO `cnpg` policy must
# include the `forgejo/*` prefix.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo
  namespace: forgejo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/forgejo
      endpointURL: http://192.168.2.112:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
