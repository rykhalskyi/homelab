# Template only -- do not commit real secrets. The real Secret is a local,
# SOPS/age-encrypted file (apps/secrets/forgejo-runner-token.sops.yaml) applied
# out of band with apps/secrets/apply.sh; see README.md.
#
# `token` is the secret half of the runner registration (the value returned by
# `forgejo forgejo-cli actions register --secret <40-hex>`, or the "Token" shown
# when creating a runner in the Forgejo UI). It is mounted at
# $CREDENTIALS_DIRECTORY/token and read via `token_url` in configmap.yaml. The
# matching `uuid` lives (unencrypted) in configmap.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-token
  namespace: forgejo-runner
type: Opaque
stringData:
  token: "replace-with-the-runner-registration-token"
