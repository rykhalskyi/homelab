# node-three machine patch, applied when generating this node's config:
#   --config-patch @nodes/node-three/patch.yaml
#
# 0. Pin the installer to the cluster's Talos version (the local talosctl is
#    v1.14.2 while the cluster runs v1.14.4) and set the node name explicitly.
# 1. Allow workloads on this control plane: delete the
#    node-role.kubernetes.io/control-plane:NoSchedule taint.
# 2. Static network on 192.168.2.235. NIC confirmed as enp1s0 in maintenance
#    mode (Talos 1.14, 2026-10-31). Install disk is /dev/sda (256 GB SanDisk).
# 3. Cluster-wide CNI switch: drop Talos's default flannel and disable
#    kube-proxy so Cilium (cilium/install.sh) takes over. Apply the CNI part
#    to EVERY node; the network part is per-node.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.4
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: node-three
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
machine:
  network:
    interfaces:
      - interface: enp1s0
        addresses:
          - 192.168.2.235/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
        dhcp: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
