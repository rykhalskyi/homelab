# node-two machine patch, applied when generating this node's config:
#   --config-patch @nodes/node-two/patch.yaml
#
# 1. Allow workloads on this single control-plane node: delete the
#    node-role.kubernetes.io/control-plane:NoSchedule taint. Drop this if you
#    add dedicated workers.
# 2. Static network on eno1 -- the cluster endpoint/API is 192.168.2.234, so
#    the node must always come back on that address (DHCP would move it).
# 3. Cluster-wide CNI switch: drop Talos's default flannel and disable
#    kube-proxy so Cilium (cilium/install.sh) takes over. Apply the CNI part
#    to EVERY node; the network part is per-node.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
machine:
  network:
    interfaces:
      - interface: eno1
        addresses:
          - 192.168.2.234/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
        dhcp: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# 4. Dedicated 256 GB SATA SSD (SanDisk SD8TB8U2) as a Talos user volume for
#    Kubernetes local storage. Talos creates partition `u-ssd` and mounts it at
#    /var/mnt/ssd (automatically propagated into kubelet).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ssd
provisioning:
  diskSelector:
    match: disk.wwid == "naa.5001b448b4848c13"
  minSize: 200GiB
  grow: true
filesystem:
  type: xfs
