apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # local-path-provisioner creates short-lived *helper* pods that run
    # privileged and mount the node's filesystem to create/remove the volume
    # directories. The namespace must permit that (default PSA would reject it).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
