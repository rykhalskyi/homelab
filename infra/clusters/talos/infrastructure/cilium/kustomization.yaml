apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cilium L2 announcements + LB IPAM for the LAN ingress VIP, reconciled by Flux.
#
# NOTE: distinct from ../../cilium/ (values.yaml + install.sh), which installs
# Cilium itself out of band. The CRDs these objects use are provided by that
# install, so Cilium must already exist (it does before Flux runs).
resources:
  - lb-ip-pool.yaml
  - l2-announcement-policy.yaml
