# Traefik ingress controller for the talos cluster.
#
# Traefik is exposed as a LoadBalancer Service. Cilium's LB IPAM assigns the VIP
# 192.168.2.240 from the `lan-ingress` CiliumLoadBalancerIPPool (see
# infrastructure/cilium) and the CiliumL2AnnouncementPolicy ARP-announces it on
# the LAN from whichever node holds the leader lease. The VIP therefore does not
# depend on the node running Traefik, and no nodeSelector/hostPort pinning is
# needed.
#
# Ingresses use `ingressClassName: traefik` (the chart creates that class).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.7.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    service:
      # Pin the Service to the pool's address; Cilium LB IPAM honours it.
      annotations:
        lbipam.cilium.io/ips: "192.168.2.240"
      spec:
        # Chart 41.x nests this under service.spec (not service.type).
        type: LoadBalancer
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
