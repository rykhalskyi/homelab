# Transcributed's Helm chart is published as an OCI artifact by the app repo's
# "Lint and publish chart" workflow. 0.2.5 adds the web UI and drops the invalid
# KEDA ScaledJob `cooldownPeriod` field.
#
# The chart's image tags default to `<appVersion>` while the published images are
# tagged `v<appVersion>` / `sha-<commit>`; the HelmRelease pins all three tags
# explicitly.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: transcributed
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/rykhalskyi/charts/transcributed
  ref:
    tag: "0.2.6"
