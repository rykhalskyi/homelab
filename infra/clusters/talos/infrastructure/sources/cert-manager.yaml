# cert-manager publishes its Helm chart on charts.jetstack.io. Flux tracks the
# index here; the HelmRelease pins the exact chart version (v1.21.3, which
# installs the CRDs from templates because there is no `crds/` directory).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
