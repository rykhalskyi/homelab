apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager add-on. The ClusterIssuer and wildcard Certificate are NOT here:
# they depend on cert-manager CRDs being installed, so they live in the
# `cert-manager-config` Kustomization (`../../cert-manager-config/`), which
# dependsOn this layer.
resources:
  - namespace.yaml
  - helmrelease.yaml
