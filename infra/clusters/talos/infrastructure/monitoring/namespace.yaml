apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # The cluster defaults namespaces to the `baseline` PodSecurity level, which
    # forbids the host access node-exporter needs (hostNetwork, hostPID,
    # hostPath, hostPort 9100). The monitoring namespace must therefore be
    # `privileged`. (Prometheus/Grafana/Alertmanager still run as non-root; only
    # the node-exporter DaemonSet needs the extra privileges.)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
