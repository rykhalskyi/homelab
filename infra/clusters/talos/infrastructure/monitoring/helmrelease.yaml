# kube-prometheus-stack bundles the whole observability stack in one release:
#   Prometheus + Prometheus Operator, Grafana, Alertmanager,
#   node-exporter (per-node host metrics), kube-state-metrics (object state).
#
# Release name is `kube-prometheus-stack`, so the Services are
# kube-prometheus-stack-{grafana,prometheus,alertmanager} in `monitoring`.
#
# Talos tuning below: Talos runs etcd/controller-manager/scheduler as static
# pods bound to localhost, and Cilium replaces kube-proxy, so those four
# ServiceMonitors are disabled (they would scrape nothing and just add noise).
# Everything else (apiserver, kubelet, node-exporter, kube-state-metrics) works.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # --- Talos: disable unscrapeable control-plane / proxy targets ---
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # --- Single-node: scrape the two heaviest jobs every 60s instead of 30s.
    # Halves ingestion (~441 -> ~220 samples/s) with no loss of scraped metrics.
    kubeApiServer:
      serviceMonitor:
        interval: 60s
    kubelet:
      serviceMonitor:
        interval: 60s

    # --- Prometheus: 3d of history; right-sized for a single node ---
    prometheus:
      prometheusSpec:
        retention: 3d
        retentionSize: 4GB
        scrapeInterval: 60s
        # The Prometheus Operator mounts the data volume with `subPath:
        # prometheus-db`, and the kubelet creates that subdirectory as
        # root:root 0755 — Kubernetes does NOT apply fsGroup to subPath mounts.
        # Prometheus runs as uid 1000, so it cannot write its data dir
        # (`/prometheus/queries.active: permission denied`) and crashloops.
        # This init container (root) creates and chowns the subPath dir first.
        initContainers:
          - name: init-chown-data
            image: busybox:1.36
            command:
              - sh
              - -c
              - mkdir -p /prometheus && chown -R 1000:2000 /prometheus
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-prometheus-db
                mountPath: /prometheus
                subPath: prometheus-db
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  # retentionSize is 4GB; 5Gi leaves headroom. NB: PVCs cannot be
                  # shrunk, so an existing 10Gi volume stays 10Gi until recreated.
                  storage: 5Gi

    # --- Alertmanager: config comes from the out-of-band SOPS Secret ---
    # `configSecret` must contain a key `alertmanager.yaml`; it is created by
    # apps/secrets/apply.sh (namespace monitoring), not committed.
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    # --- Grafana: admin password from the out-of-band SOPS Secret ---
    # `defaultDashboardsEnabled: false` drops the 25 bundled kube-prometheus-stack
    # dashboards to cut Grafana + dashboard-sidecar memory. The curated set we
    # actually use (Alertmanager/CoreDNS/Grafana/API-server/Compute-Resources
    # Cluster+Multi-Cluster) is re-added declaratively via grafana-dashboards.yaml,
    # which carries the sidecar's `grafana_dashboard: "1"` label. Manually
    # imported dashboards (e.g. Cilium) live in Grafana's PV and are unaffected.
    grafana:
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-admin
      persistence:
        enabled: true
        type: sts
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        size: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # The Ingress is a standalone manifest (grafana-ingress.yaml) to match the
      # repo's convention of keeping Ingress objects explicit.
      ingress:
        enabled: false

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # --- Bound the subcharts that ship with no resources set ---
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 96Mi
