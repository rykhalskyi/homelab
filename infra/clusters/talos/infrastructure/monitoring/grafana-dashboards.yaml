# Curated Grafana dashboards for the talos cluster.
#
# kube-prometheus-stack's 25 bundled dashboards are disabled in the HelmRelease
# (`grafana.defaultDashboardsEnabled: false`) to cut Grafana + dashboard-sidecar
# memory. This ConfigMap re-adds only the six we actually use. The dashboard
# sidecar loads any ConfigMap labelled `grafana_dashboard: "1"` (its provider is
# independent of `defaultDashboardsEnabled`), so this file is the single source
# of truth for the provisioned set.
#
# The JSON is copied verbatim from the chart's generated dashboard ConfigMaps
# (kube-prometheus-stack 92.2.0). To refresh, re-copy from the release.
#
# Dashboards added by hand in the Grafana UI (e.g. Cilium v1.12 Agent/Operator)
# live in Grafana's PV and are not managed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-selected
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  alertmanager-overview.json: |-
