# CloudNativePG operator. Owns the postgresql.cnpg.io CRDs (Cluster,
# ScheduledBackup, Backup, ...) and reconciles the `postgres` Cluster below.
#
# Chart pinned exactly (0.29.1 == operator 1.30.1, default operand PostgreSQL
# 18.4). The operator watches all namespaces by default, so the database
# workload lives in `databases` while the controller runs in `cnpg-system`.
#
# CRDs are managed through the chart; Flux's install/upgrade.crds make sure
# they are created (and upgraded) with the release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
