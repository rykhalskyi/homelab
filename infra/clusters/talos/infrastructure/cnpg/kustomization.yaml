apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CloudNativePG operator only. The `Cluster` and `ScheduledBackup` CRs live in
# the `apps` layer (infra/clusters/talos/apps/cnpg) as their own Flux
# Kustomization that dependsOn `infrastructure`: a CR cannot be applied in the
# same Kustomization that installs its CRD (the server-side dry-run fails with
# "no matches for kind ...", which aborts the whole apply).
resources:
  - namespace.yaml
  - databases-namespace.yaml
  - helmrelease.yaml
