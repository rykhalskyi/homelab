apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CloudNativePG operator + a single PostgreSQL cluster with MinIO backups.
# The operator must be running before the `Cluster` CR can be reconciled;
# Flux retries the apply until the postgresql.cnpg.io CRDs are established.
resources:
  - namespace.yaml
  - databases-namespace.yaml
  - helmrelease.yaml
  - cluster.yaml
  - scheduled-backup.yaml
