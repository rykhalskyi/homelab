apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This is the entrypoint reconciled by the `flux-system` Kustomization
# (gotk-sync.yaml -> path: ./infra/k8s/clusters/node-one). Keeping it explicit
# instead of relying on kustomize-controller's auto-generated kustomization.
resources:
  - apps.yaml
  - infrastructure.yaml
