apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This is the entrypoint reconciled by the `flux-system` Kustomization
# (gotk-sync.yaml -> path: ./infra/k8s/clusters/node-one). Keeping it explicit
# instead of relying on kustomize-controller's auto-generated kustomization.
#
# `flux-system` MUST be listed: the previous auto-generated kustomization
# recursed into that directory, so Flux was (and must stay) managing its own
# controllers/GitRepository. Omitting it makes a `prune: true` reconcile delete
# Flux itself.
resources:
  - apps.yaml
  - infrastructure.yaml
  - flux-system
