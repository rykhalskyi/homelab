# Nextcloud on k3s.
#
# Deployed by Flux (listed in infra/k8s/apps/kustomization.yaml). This is a
# fresh install: on first boot the official entrypoint runs
# `occ maintenance:install` using the NEXTCLOUD_ADMIN_* env from the
# `nextcloud-admin` Secret. The byebyemoneylist app is baked into the image at
# /opt and copied into custom_apps by the `before-starting` hook below.
#
# The image tag is the custom image built by
# .github/workflows/build-nextcloud-image.yml and kept in sync by
# .github/workflows/update-nextcloud-image-pin.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: homelab
spec:
  interval: 1h
  chart:
    spec:
      chart: nextcloud
      version: ">=5.0.0"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  values:
    image:
      registry: ghcr.io
      repository: rykhalskyi/homelab-nextcloud
      tag: "sha-a10e9ba57d51853f2066e5b66bb47123c4461054@sha256:2ce84d5e42fcc200c80025bf7018c4d82e4ae4664f92748fc5406ec1e88c95b6"
    replicaCount: 1
    nextcloud:
      host: cloud.otakeessen.com
      trustedDomains:
        - cloud.otakeessen.com
      datadir: /var/www/html/data
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      extraEnv:
        - name: TRUSTED_PROXIES
          value: "10.42.0.0/16"
        - name: APACHE_DISABLE_REWRITE_IP
          value: "1"
        - name: FORWARDED_FOR_HEADERS
          value: "HTTP_X_FORWARDED_FOR HTTP_CF_CONNECTING_IP"
        - name: SILICONFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: byebyemoneylist
              key: SILICONFLOW_API_KEY
      hooks:
        before-starting: |
          #!/bin/sh
          set -e
          SRC=/opt/byebyemoneylist
          APP=/var/www/html/custom_apps/byebyemoneylist
          mkdir -p /var/www/html/custom_apps
          [ -d "$SRC" ] && { rm -rf "$APP"; cp -a "$SRC" "$APP"; }
          [ -n "${SILICONFLOW_API_KEY:-}" ] && {
            printf 'SILICONFLOW_API_KEY=%s\n' "$SILICONFLOW_API_KEY" > "$APP/.env"
            chmod 640 "$APP/.env"
          }
          code="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$APP/appinfo/info.xml")"
          inst="$(php /var/www/html/occ config:app:get byebyemoneylist installed_version 2>/dev/null || true)"
          if [ "$inst" != "$code" ]; then
            php /var/www/html/occ app:disable byebyemoneylist >/dev/null 2>&1 || true
            php /var/www/html/occ app:enable byebyemoneylist
          fi
    phpClientHttpsFix:
      enabled: true
      protocol: https
    persistence:
      enabled: true
      existingClaim: nextcloud-html
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      existingSecret:
        enabled: true
        secretName: nextcloud-db
        usernameKey: username
        passwordKey: password
    postgresql:
      enabled: true
      global:
        postgresql:
          auth:
            database: nextcloud
            username: nextcloud
            existingSecret: nextcloud-db
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
      primary:
        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi
    redis:
      enabled: true
      auth:
        existingSecret: nextcloud-redis
        existingSecretPasswordKey: redis-password
    ingress:
      enabled: true
      className: traefik
    cronjob:
      enabled: true
      type: cronjob
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # On first boot the entrypoint runs `occ maintenance:install` before Apache
    # listens. The default liveness probe would hit /status.php during that
    # window, get "connection refused", and kill the container mid-install.
    # The startup probe gates liveness/readiness until Apache answers, so the
    # install gets its full 10m budget.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1
