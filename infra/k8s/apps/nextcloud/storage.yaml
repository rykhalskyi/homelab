# Storage for the in-cluster Nextcloud.
#
# `nextcloud-data` reuses the existing AIO data directory `/home/jaro/ncdata` as
# a static local PV. This is the whole reason the migration is in-place: the data
# is not copied, so only one Nextcloud may touch it at a time (stop AIO first,
# see the "Nextcloud on k3s" wiki page).
#
# NOTE: the `local-storage` StorageClass must exist on the cluster (the k3s
# default is `local-path`). The data PV is statically bound by volumeName anyway.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /home/jaro/ncdata
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node-one
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: homelab
spec:
  storageClassName: local-storage
  volumeName: nextcloud-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
# The rest of /var/www/html (code, config, custom_apps, themes) lives on a
# small dynamically provisioned PVC, seeded by the `seed-nextcloud` init
# container on first boot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: homelab
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
