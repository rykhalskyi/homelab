# Template only -- do not commit real secrets, and this file is intentionally
# not listed in kustomization.yaml. Create the Secret out of band before the
# first rollout.
#
#   kubectl -n homelab create secret generic pullini-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(50))')" \
#     --from-literal=DATABASE_URL='postgres://pullini:<DB_PASSWORD>@postgresql.homelab.svc.cluster.local:5432/pullini' \
#     --from-literal=DJANGO_SUPERUSER_USERNAME='admin' \
#     --from-literal=DJANGO_SUPERUSER_EMAIL='you@example.com' \
#     --from-literal=DJANGO_SUPERUSER_PASSWORD='<ADMIN_PASSWORD>'
#
# Then provision the role + database (idempotent):
#   bash infra/k8s/apps/pullini/provision-db.sh
apiVersion: v1
kind: Secret
metadata:
  name: pullini-secrets
  namespace: homelab
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-with-a-long-random-value"
  DATABASE_URL: "postgres://pullini:change-me@postgresql.homelab.svc.cluster.local:5432/pullini"
  # Optional: seeds the single admin user on first boot when present.
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "you@example.com"
  DJANGO_SUPERUSER_PASSWORD: "replace-with-a-strong-random-value"
