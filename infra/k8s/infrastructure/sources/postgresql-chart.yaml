# Bitnami publishes its charts as OCI artifacts. The legacy
# `https://charts.bitnami.com/bitnami` index now lists each chart's URL as
# `oci://registry-1.docker.io/bitnamicharts/...`, which Flux cannot fetch
# through a (generic) HelmRepository, so the chart is consumed via an
# OCIRepository instead (referenced by chartRef in the HelmRelease).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bitnami-postgresql
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts/postgresql
  ref:
    tag: "16.7.27" # appVersion Postgres 17.6.0
