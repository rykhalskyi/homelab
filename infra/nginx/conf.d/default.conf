server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames are not fingerprinted, so after a deploy a client could
    # pair the new HTML with an old cached stylesheet (symptom: the grid
    # collapses to a single column). Make clients revalidate instead of
    # blindly caching; ETag/Last-Modified keep the revalidation cheap.
    expires -1;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
