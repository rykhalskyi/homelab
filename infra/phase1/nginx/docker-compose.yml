# nginx serving the homelab landing page (mirrors ~/Source/nginx on node-one).
services:
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../images/nginx/html:/usr/share/nginx/html:ro
      - ../../images/nginx/conf.d:/etc/nginx/conf.d:ro
