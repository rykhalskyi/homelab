name: k3s/nginx 2/2 Pin nginx site image

# Keeps infra/k8s/apps/nginx/deployment.yaml pinned to the image CI just built.
# It resolves the digest of the sha-<commit> tag from GHCR and opens a pull
# request, matching the other pin-update workflows (laya-api,
# byebyemoneylist). Merge the PR and Flux reconciles the new image on node-one.
#
# Triggers:
#   - workflow_run      -> after "k3s/nginx 1/2 Build nginx site image" succeeds on main
#   - workflow_dispatch -> manual run, optionally pinning a specific commit SHA
#
# Note: workflow_run only fires for workflows that exist on the default branch,
# so this takes effect once merged to main.

on:
  workflow_run:
    workflows: ["k3s/nginx 1/2 Build nginx site image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA of the sha-<sha> image tag to pin. Empty = latest main.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: update-nginx-image-pin
  cancel-in-progress: false

jobs:
  pin:
    name: Refresh deployment.yaml
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'rykhalskyi/homelab' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve image digest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/rykhalskyi/homelab-nginx
          INPUT_SHA: ${{ github.event.inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-}}"
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          fi
          tag="sha-${sha}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          [ -n "$digest" ] || { echo "::error::could not resolve digest for ${IMAGE}:${tag}"; exit 1; }

          new="${IMAGE}:${tag}@${digest}"
          file=infra/k8s/apps/nginx/deployment.yaml
          current="$(grep -oP 'image:\s*\K\S*homelab-nginx\S*' "$file" || true)"

          {
            echo "sha=${sha}"
            echo "short=${sha:0:7}"
            echo "image=${new}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: ${new}"
          echo "Pinned:   ${current:-none}"
          if [ "$new" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to this digest - nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update deployment.yaml
        if: steps.resolve.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          file=infra/k8s/apps/nginx/deployment.yaml
          sed -i -E "s|^(\s*image: ).*homelab-nginx.*$|\1${IMAGE}|" "$file"

      - name: Show diff
        if: steps.resolve.outputs.changed == 'true'
        run: git --no-pager diff

      - name: Open pull request
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/nginx-image-${{ steps.resolve.outputs.short }}
          base: main
          delete-branch: true
          title: "Pin nginx site image to sha-${{ steps.resolve.outputs.short }}"
          commit-message: "Pin nginx site image to sha-${{ steps.resolve.outputs.short }}"
          labels: |
            dependencies
          body: |
            Automated pin update after the `k3s/nginx 1/2 Build nginx site image` workflow
            succeeded for commit `${{ steps.resolve.outputs.sha }}`.

            - image: `${{ steps.resolve.outputs.image }}`

            Merge; Flux on `node-one` reconciles the new image within its
            `apps` interval.
