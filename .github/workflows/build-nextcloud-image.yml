name: talos/nextcloud 2/3 Build Nextcloud image

# Builds the custom Nextcloud image (official base + the pinned BookTailor and
# Bye Bye Money List release tarballs) and pushes it to GHCR. The talos
# HelmRelease consumes the image by tag + digest, and the
# "talos/nextcloud 3/3 Pin Nextcloud image" workflow bumps that pin (via PR)
# after this one succeeds.
#
# Everything is driven by infra/images/nextcloud/versions.env:
#   BYML_VERSION / BYML_SHA256               -> Bye Bye Money List tarball
#   BOOKTAILOR_VERSION / BOOKTAILOR_SHA256   -> BookTailor tarball
#   NEXTCLOUD_VERSION                        -> the official Nextcloud base tag
#
# The tarballs are downloaded and checksum-verified here, so the image always
# contains exactly the reviewed releases and the frontends are never rebuilt.

on:
  push:
    branches: [main]
    paths:
      - 'infra/images/nextcloud/Dockerfile'
      - 'infra/images/nextcloud/versions.env'
      - '.github/workflows/build-nextcloud-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-nextcloud-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Load pinned versions
        id: pin
        run: |
          set -euo pipefail
          set -a; . infra/images/nextcloud/versions.env; set +a
          for key in BYML_VERSION BYML_SHA256 BOOKTAILOR_VERSION BOOKTAILOR_SHA256 NEXTCLOUD_VERSION; do
            [ -n "${!key:-}" ] || { echo "::error::$key is empty"; exit 1; }
          done
          {
            echo "byml_version=${BYML_VERSION}"
            echo "booktailor_version=${BOOKTAILOR_VERSION}"
            echo "nextcloud_version=${NEXTCLOUD_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the release tarballs
        run: |
          set -euo pipefail
          set -a; . infra/images/nextcloud/versions.env; set +a

          download_app() {
            app="$1"
            repo="$2"
            version="$3"
            sha="$4"
            url="https://github.com/${repo}/releases/download/v${version}/${app}-${version}.tar.gz"

            echo "Downloading ${app} v${version} from ${url}"
            curl -fsSL --retry 3 --retry-delay 2 -o "/tmp/${app}.tar.gz" "$url"
            printf '%s  /tmp/%s.tar.gz\n' "$sha" "$app" | sha256sum -c -

            tar -xzf "/tmp/${app}.tar.gz" -C build-context
            test -f "build-context/${app}/appinfo/info.xml"

            actual="$(grep -oP '(?<=<version>)[^<]+' "build-context/${app}/appinfo/info.xml")"
            if [ "$actual" != "$version" ]; then
              echo "::error::${app} tarball version '${actual}' does not match pin '${version}'"
              exit 1
            fi
            echo "${app} v${actual} verified"
          }

          mkdir -p build-context
          download_app byebyemoneylist rykhalskyi/byebyemoneylist-ns "${BYML_VERSION}" "${BYML_SHA256}"
          download_app booktailor rykhalskyi/booktailor "${BOOKTAILOR_VERSION}" "${BOOKTAILOR_SHA256}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: infra/images/nextcloud/Dockerfile
          push: true
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.pin.outputs.nextcloud_version }}
          tags: ghcr.io/${{ github.repository_owner }}/homelab-nextcloud:sha-${{ github.sha }}

      - name: Show the digest to pin
        run: |
          echo "Pin this digest: ${{ steps.build.outputs.digest }}"
          echo "Apps baked:"
          echo "  byebyemoneylist: ${{ steps.pin.outputs.byml_version }}"
          echo "  booktailor:      ${{ steps.pin.outputs.booktailor_version }}"
          echo "Nextcloud base:    ${{ steps.pin.outputs.nextcloud_version }}"
