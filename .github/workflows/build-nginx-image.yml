name: k3s/nginx 1/2 Build nginx site image

# Builds the homelab landing page (infra/nginx: conf.d + static html) into a
# container image and pushes it to GHCR. The k3s Deployment consumes the image
# by tag + digest in infra/k8s/apps/nginx/deployment.yaml; the "k3s/nginx 2/2
# Pin nginx site image" workflow bumps that pin (via PR) after this one succeeds.
#
# The wiki is no longer built into this image; it is served by Pullini at
# wiki.otakeessen.com (see docs/wiki/pages/pullini-on-k3s.md).

on:
  push:
    branches: [main]
    paths:
      - 'infra/nginx/**'
      - '.github/workflows/build-nginx-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: infra/nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/homelab-nginx:sha-${{ github.sha }}

      - name: Show the digest to pin
        run: |
          echo "Pin this digest: ${{ steps.build.outputs.digest }}"
